<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- County Shield Outline -->
  <path d="M256 64 L416 128 V272 C416 368 256 448 256 448 C256 448 96 368 96 272 V128 Z" 
        fill="url(#shieldGrad)" stroke="#fbbf24" stroke-width="12" stroke-linejoin="round" />

  <!-- Roadway Perspective Motif -->
  <path d="M192 380 L236 170 H276 L320 380 Z" fill="#1e293b" />
  
  <!-- Dashed Highway Centerline -->
  <line x1="256" y1="190" x2="256" y2="230" stroke="#fef08a" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="260" x2="256" y2="310" stroke="#fef08a" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="340" x2="256" y2="380" stroke="#fef08a" stroke-width="14" stroke-linecap="round" />

  <!-- Gold Star / Inspection Badge Header -->
  <circle cx="256" cy="140" r="16" fill="#fef08a" />
  <polygon points="256,128 261,138 272,140 264,147 266,158 256,152 246,158 248,147 240,140 251,138" fill="#78350f" />
</svg>
