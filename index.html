    <script>
      // Suppress benign WebSocket/HMR disconnection errors in cloud sandbox environment
      window.addEventListener('error', function (e) {
        if (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened') || e.message.includes('[vite]'))) ||
          (e.filename && e.filename.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && String(e.reason).includes('WebSocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
